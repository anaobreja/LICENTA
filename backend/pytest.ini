[pytest]
# Timeout per test (secunde). Daca un test depaseste, pytest-timeout dump-uieste
# stack-ul tuturor thread-urilor (method=thread) si omoara testul. Esential
# pentru a prinde hang-uri pe TRUNCATE / lock-uri DB / socket recv.
timeout = 60
timeout_method = thread

# Filtre pentru warnings: suprim zgomotul third-party care nu depinde de codul nostru.
# Pastrez warnings din codul nostru (app/*) si testele noastre.
#
# Format pytest filterwarnings: ACTION:MESSAGE_REGEX:CATEGORY:MODULE:LINENO
#
# Note: warning-urile asyncio.iscoroutinefunction (DeprecationWarning Python 3.16)
# vin din fastapi/routing.py + starlette/_utils.py. Sunt third-party — vor disparea
# cand FastAPI + Starlette publica versiuni compatibile cu Python 3.14+.

filterwarnings =
    default
    # Asyncio deprecations din FastAPI + Starlette + uvicorn (Python 3.16 removal)
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning
    # Pydantic v2 class-based Config deprecations din third-party
    ignore:.*class-based.*config.*deprecated.*:DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    # psycopg3 GC warning cand pool-ul SQLAlchemy isi inchide conexiunile la teardown
    ignore:.*was deleted while still open.*:ResourceWarning:psycopg
